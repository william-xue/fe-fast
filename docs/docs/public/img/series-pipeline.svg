<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="ttl">
  <title id="ttl">工业时序曲线的绘制管线：环形缓冲 → 可视窗口 → 像素列 → 包络 → 增量左移</title>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a7290"/>
    </marker>
    <marker id="arwBig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#35e0c2"/>
    </marker>
    <style>
      .bg { fill:#0b0f14; }
      .panel { fill:#111823; stroke:#1e2a38; stroke-width:1; }
      .t { fill:#d7e2ee; font:600 13px "PingFang SC","Helvetica Neue",Arial,sans-serif; }
      .s { fill:#7f8fa3; font:11px "PingFang SC","Helvetica Neue",Arial,sans-serif; }
      .m { fill:#93a5b8; font:10.5px "SF Mono",Menlo,Consolas,monospace; }
      .acc { fill:#35e0c2; }
      .warn { fill:#ffb020; }
      .num { fill:#a9bccd; font:11px "SF Mono",Menlo,Consolas,monospace; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760"/>

  <!-- ================= 第 1 行：数据 → 窗口 → 列 ================= -->
  <text class="t" x="24" y="30">数据怎么进到画面上：三步把 100 万点变成 1348 段线</text>
  <text class="s" x="24" y="50">① 定长环形缓冲 → ② 按可视窗口裁剪 → ③ 时间轴切成像素列，每列只留 4 个数</text>

  <!-- ① 环形缓冲 -->
  <rect class="panel" x="24" y="66" width="330" height="150" rx="8"/>
  <text class="t" x="40" y="90">① 存：Float64Array 环形缓冲</text>
  <g>
    <rect x="40" y="110" width="40" height="28" fill="#16202b" stroke="#25405a"/>
    <rect x="80" y="110" width="40" height="28" fill="#16202b" stroke="#25405a"/>
    <rect x="120" y="110" width="40" height="28" fill="#16202b" stroke="#25405a"/>
    <rect x="160" y="110" width="40" height="28" fill="#0f2a26" stroke="#35e0c2"/>
    <rect x="200" y="110" width="40" height="28" fill="#16202b" stroke="#25405a"/>
    <text class="num" x="166" y="129">t,v</text>
    <text class="m" x="40" y="150">容量固定，写入 O(1)，零分配</text>
  </g>
  <path d="M160 102 L160 94 L120 94 L120 102" fill="none" stroke="#35e0c2" stroke-width="1.4"/>
  <text class="acc m" x="126" y="90">写入头</text>
  <text class="m" x="40" y="172">10 万 / 100 万点，内存是一条直线</text>
  <text class="m" x="40" y="192">（不是 push + shift 那种锯齿）</text>

  <line x1="360" y1="140" x2="392" y2="140" stroke="#5a7290" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- ② 窗口 -->
  <rect class="panel" x="400" y="66" width="360" height="150" rx="8"/>
  <text class="t" x="416" y="90">② 裁：只看可视时间窗</text>
  <!-- 时间轴 -->
  <line x1="420" y1="132" x2="742" y2="132" stroke="#25405a" stroke-width="2"/>
  <rect x="620" y="120" width="120" height="26" fill="#123a35" stroke="#35e0c2"/>
  <text class="acc m" x="628" y="137">60 秒窗口</text>
  <text class="m" x="420" y="112">3 小时历史</text>
  <text class="num" x="640" y="168">→ 窗口内约 3600 点</text>
  <text class="m" x="416" y="196">窗口外的不参与绘制（但仍在缓冲里）</text>

  <line x1="766" y1="140" x2="798" y2="140" stroke="#5a7290" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- ③ 列栅格 -->
  <rect class="panel" x="806" y="66" width="370" height="150" rx="8"/>
  <text class="t" x="822" y="90">③ 切：1348 个像素列</text>
  <g>
    <!-- 列条 -->
    <g fill="#16202b" stroke="#25405a">
      <rect x="822" y="104" width="18" height="52"/><rect x="842" y="104" width="18" height="52"/>
      <rect x="862" y="104" width="18" height="52"/><rect x="882" y="104" width="18" height="52"/>
      <rect x="902" y="104" width="18" height="52"/><rect x="922" y="104" width="18" height="52"/>
      <rect x="942" y="104" width="18" height="52"/><rect x="962" y="104" width="18" height="52"/>
      <rect x="982" y="104" width="18" height="52"/><rect x="1002" y="104" width="18" height="52"/>
      <rect x="1022" y="104" width="18" height="52"/><rect x="1042" y="104" width="18" height="52"/>
      <rect x="1062" y="104" width="18" height="52"/><rect x="1082" y="104" width="18" height="52"/>
      <rect x="1102" y="104" width="18" height="52"/><rect x="1122" y="104" width="18" height="52"/>
    </g>
  </g>
  <text class="num" x="822" y="178">每列 = 1 CSS px = 44.5 ms（60 秒窗）</text>
  <text class="m" x="822" y="198">回看 3 小时时：每列 ≈ 8 秒</text>

  <!-- ================= 第 2 行：单列放大 ================= -->
  <rect class="panel" x="24" y="244" width="1152" height="210" rx="8"/>
  <text class="t" x="40" y="270">④ 一列里发生什么：123 个点被压成 4 个数，然后画成"包络"</text>

  <!-- 左：原始点 -->
  <text class="s" x="46" y="296">回看时一列里约 123 个点</text>
  <g stroke="#5aa9ff" stroke-width="1.2" fill="none">
    <polyline points="46,382 60,368 74,374 88,352 102,360 116,330 130,346 144,318 158,332 172,300 186,314 200,340 214,326 228,352 242,338 256,360 270,346 284,368 300,356 314,374"/>
  </g>
  <circle cx="172" cy="300" r="3.2" fill="#ff5d5d"/>
  <text class="warn m" x="180" y="298">尖峰</text>

  <text class="num" x="46" y="404">123 个点的 min / max / first / last</text>

  <line x1="330" y1="350" x2="368" y2="350" stroke="#5a7290" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- 中：4 个数 -->
  <text class="s" x="382" y="296">4 个数</text>
  <g class="num">
    <text x="382" y="322">first  341.2</text>
    <text x="382" y="344">min    318.0</text>
    <text x="382" y="366">max    352.4</text>
    <text x="382" y="388">last   356.1</text>
  </g>
  <text class="m" x="382" y="414">（浮点数组里就是 4 个 float）</text>

  <line x1="500" y1="350" x2="538" y2="350" stroke="#5a7290" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- 右：包络 -->
  <text class="s" x="552" y="296">画出来的样子（1 px 宽的一列）</text>
  <line x1="600" y1="312" x2="600" y2="410" stroke="#1e2a38" stroke-dasharray="3 3"/>
  <line x1="632" y1="312" x2="632" y2="410" stroke="#1e2a38" stroke-dasharray="3 3"/>
  <g stroke="#35e0c2" stroke-width="1.6" fill="none">
    <path d="M630 372 L600 330 L600 352 L600 318 L600 328"/>
  </g>
  <circle cx="600" cy="318" r="2.6" fill="#ff5d5d"/>
  <g class="num">
    <text x="612" y="320" fill="#ff5d5d">max</text>
    <text x="612" y="338">first</text>
    <text x="612" y="372">last</text>
    <text x="612" y="392">min</text>
  </g>
  <text class="m" x="552" y="452">同一列的 4 个数：竖条顶端=max，底端=min，进出点是 first/last</text>
  <text class="m" x="552" y="434">相邻列的 last 连到下一列的 first，所以看起来是一条连续曲线</text>

  <!-- 右右：路径命令 -->
  <rect x="820" y="292" width="340" height="132" rx="6" fill="#16202b" stroke="#25405a"/>
  <text class="m" x="836" y="314" fill="#8ea0b4">// 每列 4 个 lineTo</text>
  <text class="num" x="836" y="336">lineTo(x, yFirst)   // 接上一列</text>
  <text class="num" x="836" y="356">lineTo(x, yMin)     // 竖条下端</text>
  <text class="num" x="836" y="376">lineTo(x, yMax)     // 竖条上端</text>
  <text class="num" x="836" y="396">lineTo(x, yLast)</text>
  <text class="m" x="836" y="416">x = 左留白 + 列号 + 0.5（半像素对齐）</text>

  <!-- ================= 第 3 行：增量左移 ================= -->
  <rect class="panel" x="24" y="476" width="1152" height="252" rx="8"/>
  <text class="t" x="40" y="502">⑤ 稳态下每帧只画新增的一列：整幅左移 + 补右侧</text>

  <!-- 上一帧 -->
  <text class="s" x="46" y="530">第 n 帧</text>
  <rect x="46" y="540" width="440" height="120" fill="#0f151d" stroke="#25405a"/>
  <path d="M46 640 L96 600 L146 620 L196 580 L246 600 L296 566 L346 590 L396 570 L446 596 L486 578"
        fill="none" stroke="#35e0c2" stroke-width="1.6"/>
  <text class="m" x="52" y="654">1348 列全部有效</text>

  <!-- 下帧 -->
  <text class="s" x="560" y="530">第 n+1 帧（时间推进 7 列）</text>
  <rect x="560" y="540" width="440" height="120" fill="#0f151d" stroke="#25405a"/>
  <path d="M560 640 L610 600 L660 620 L710 580 L760 600 L810 566 L860 590 L910 570 L960 596 L1000 578"
        fill="none" stroke="#16202b" stroke-width="1.6" stroke-dasharray="4 3"/>
  <!-- 新补的列 -->
  <rect x="993" y="540" width="7" height="120" fill="#123a35" stroke="#35e0c2" stroke-dasharray="2 2"/>
  <line x1="996" y1="536" x2="996" y2="516" stroke="#35e0c2" stroke-width="1"/>
  <text class="acc m" x="940" y="510">只画这 7 列</text>

  <!-- 左移箭头 -->
  <line x1="500" y1="600" x2="548" y2="600" stroke="#35e0c2" stroke-width="1.6" marker-end="url(#arwBig)"/>
  <text class="acc m" x="486" y="588">左移 7px</text>

  <!-- 说明 -->
  <text class="num" x="46" y="690">drawImage(canvas, -7, 0)   →   clearRect(右侧 7px)   →   只对最后 7 列跑 ④</text>
  <text class="m" x="46" y="712">单帧成本 ≈ 一列，而不是整幅；弱机器（工控机 / 远程桌面 / 无独显）上这是量级差别</text>

  <rect x="880" y="680" width="280" height="34" rx="4" fill="#1c1410" stroke="#5a4a1e"/>
  <text class="m" x="892" y="702" fill="#ffb020">WebGL 版：每帧重建全部列，不做这一步</text>
</svg>
